<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lot Change Verifier · SAMC Clinical Chemistry</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* === DESIGN TOKENS === */
  :root {
    /* Paper / ink */
    --paper:      #F6F2E8;
    --paper-2:    #EFEADC;
    --paper-3:    #E6E0CE;
    --ink:        #16140F;
    --ink-2:      #3B3830;
    --ink-3:      #6A665B;
    --ink-4:      #9C9789;
    --rule:       #D9D3C0;
    --rule-soft:  #E8E3D2;

    /* Signal */
    --pass:       #2B5C3C;
    --pass-soft:  #DDE5D2;
    --fail:       #8E2A1F;
    --fail-soft:  #ECD6CE;
    --review:     #8A5A0E;
    --review-soft:#F0DFB6;
    --accent:     #1E3A8A;
    --accent-soft:#D9E1F4;

    /* Type */
    --display: "Newsreader", ui-serif, Georgia, serif;
    --sans:    "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    --mono:    "JetBrains Mono", ui-monospace, Menlo, monospace;

    --shadow-paper: 0 1px 0 rgba(22,20,15,0.04), 0 12px 32px -16px rgba(22,20,15,0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  /* Subtle paper grain */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(22,20,15,0.018) 0, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(22,20,15,0.022) 0, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* === LAYOUT === */
  .page {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    padding: 56px 64px 120px;
  }
  @media (max-width: 900px) {
    .page { padding: 32px 24px 80px; }
  }

  /* === MASTHEAD === */
  .masthead {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: end;
    gap: 32px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--ink);
    position: relative;
  }
  .masthead::after {
    /* double rule */
    content: "";
    position: absolute; left: 0; right: 0; bottom: -5px;
    height: 1px; background: var(--ink);
  }
  .seal {
    width: 56px; height: 56px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--display);
    font-style: italic;
    font-size: 28px;
    font-weight: 500;
    background: var(--paper);
    color: var(--ink);
    position: relative;
  }
  .seal::after {
    content: "";
    position: absolute; inset: 4px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    opacity: 0.35;
  }

  .wordmark { line-height: 1; }
  .wordmark .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 10px;
  }
  .wordmark h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 44px;
    letter-spacing: -0.022em;
    margin: 0;
    line-height: 0.95;
  }
  .wordmark h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--ink-2);
  }

  .meta {
    display: flex;
    align-items: end;
    gap: 28px;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
  }
  .meta .meta-item span:first-child { display: block; color: var(--ink-4); margin-bottom: 4px; font-size: 9.5px; }
  .meta .meta-item span:last-child { color: var(--ink); font-weight: 500; }

  /* === SUB-MASTHEAD STRIP === */
  .strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 28px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .strip .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--pass);
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 0 3px var(--pass-soft);
  }
  .strip .btn-clear {
    appearance: none;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 7px 14px 6px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .strip .btn-clear:hover { background: var(--ink); color: var(--paper); }

  /* === STEP HEADINGS === */
  .step-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .step-header .h {
    font-family: var(--display);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.012em;
    margin: 0;
    line-height: 1;
  }
  .step-header .h .num {
    font-family: var(--mono);
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    margin-right: 10px;
    vertical-align: 4px;
  }
  .step-header .helper {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-4);
  }
  .step-header .helper kbd {
    font-family: var(--mono);
    font-size: 10px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--ink-2);
  }

  /* === SEARCH (analyte picker) === */
  .picker {
    position: relative;
    margin-bottom: 44px;
  }
  .picker-field {
    position: relative;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    transition: border-color .2s ease, background .2s ease;
  }
  .picker-field.is-selected {
    background: var(--paper);
    border-color: var(--ink);
  }
  .picker-field.is-open {
    border-color: var(--ink);
    border-bottom-color: transparent;
  }
  .picker input {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    padding: 22px 22px 22px 60px;
    font-family: var(--display);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.012em;
    color: var(--ink);
  }
  .picker input::placeholder {
    color: var(--ink-4);
    font-style: italic;
    font-weight: 400;
  }
  .picker .pre {
    position: absolute;
    left: 22px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    pointer-events: none;
  }
  .picker .pre::after {
    content: "";
    display: inline-block;
    width: 8px; height: 1px;
    background: var(--ink-3);
    margin-left: 6px; margin-bottom: 4px;
    vertical-align: middle;
  }
  .picker .clear-x {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    appearance: none; background: transparent; border: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    cursor: pointer;
    letter-spacing: 0.12em;
    padding: 6px 8px;
  }
  .picker .clear-x:hover { color: var(--ink); }

  .dropdown {
    position: absolute;
    left: 0; right: 0; top: 100%;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-top: none;
    max-height: 360px;
    overflow-y: auto;
    z-index: 30;
    box-shadow: var(--shadow-paper);
  }
  .dropdown-group-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-4);
    padding: 14px 22px 6px;
    background: var(--paper-2);
    border-top: 1px solid var(--rule-soft);
  }
  .dropdown-group-label:first-child { border-top: none; }
  .dropdown-row {
    display: grid;
    grid-template-columns: 32px 1fr auto auto;
    align-items: baseline;
    gap: 16px;
    padding: 12px 22px;
    cursor: pointer;
    border-top: 1px solid var(--rule-soft);
    transition: background .12s ease;
  }
  .dropdown-row:hover, .dropdown-row.is-active {
    background: var(--paper-2);
  }
  .dropdown-row .idx {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-4);
    letter-spacing: 0.06em;
  }
  .dropdown-row .name {
    font-family: var(--display);
    font-weight: 500;
    font-size: 16px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .dropdown-row .name mark {
    background: transparent;
    color: var(--ink);
    border-bottom: 1.5px solid var(--accent);
    padding-bottom: 0;
  }
  .dropdown-row .crit {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .dropdown-row .inst {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-4);
  }
  .dropdown-empty {
    padding: 40px 22px;
    text-align: center;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* === ANALYTE CARD (after selection) === */
  .analyte-card {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    border: 1px solid var(--ink);
    background: var(--paper);
    margin-bottom: 44px;
  }
  .analyte-card .cell {
    padding: 18px 20px;
    border-right: 1px solid var(--rule);
  }
  .analyte-card .cell:last-child { border-right: none; }
  .analyte-card .cell-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .analyte-card .cell-value {
    font-family: var(--display);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.012em;
    line-height: 1.1;
    color: var(--ink);
  }
  .analyte-card .cell-value .sub {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--ink-3);
    margin-top: 4px;
  }
  .analyte-card .cell-value .unit {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 4px;
    letter-spacing: 0.04em;
  }
  .analyte-card .cell-value em {
    font-style: italic;
    color: var(--ink-2);
    font-weight: 400;
  }
  @media (max-width: 900px) {
    .analyte-card { grid-template-columns: 1fr 1fr; }
    .analyte-card .cell { border-right: none; border-bottom: 1px solid var(--rule); }
    .analyte-card .cell:nth-child(even) { border-left: 1px solid var(--rule); }
  }

  /* === DATA TABLE === */
  .table-wrap { margin-bottom: 24px; }
  .table {
    width: 100%;
    border-collapse: collapse;
    background: var(--paper);
    border: 1px solid var(--ink);
  }
  .table thead th {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-align: left;
    color: var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 14px 10px;
    font-weight: 500;
    border-right: 1px solid var(--ink-2);
  }
  .table thead th:last-child { border-right: none; }
  .table thead th.num { text-align: right; }
  .table thead th.center { text-align: center; }
  .table thead th .u {
    color: var(--ink-4);
    margin-left: 6px;
    font-weight: 400;
  }

  .table tbody td {
    padding: 0;
    border-top: 1px solid var(--rule-soft);
    background: var(--paper);
    vertical-align: middle;
  }
  .table tbody tr:first-child td { border-top: none; }
  .table tbody tr.has-input td.idx-cell { background: var(--paper-2); }
  .table .idx-cell {
    width: 38px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-4);
    border-right: 1px solid var(--rule-soft);
    padding: 0 0 0 0;
    height: 44px;
  }

  .cell-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 14px;
    color: var(--ink);
    text-align: right;
    font-variant-numeric: tabular-nums;
    height: 44px;
  }
  .cell-input:focus {
    background: #FAF6E8;
    box-shadow: inset 0 0 0 1.5px var(--ink);
  }
  .cell-input::placeholder { color: var(--ink-4); font-weight: 300; }

  .table .input-cell { border-right: 1px solid var(--rule-soft); padding: 0; width: 22%; }
  .table .diff-cell {
    text-align: right;
    padding: 0 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    border-right: 1px solid var(--rule-soft);
    width: 13%;
  }
  .table .diff-cell .compare {
    color: var(--ink-4);
    font-size: 10px;
    margin-left: 6px;
    letter-spacing: 0.04em;
  }
  .table .diff-cell.over { color: var(--fail); }
  .table .verdict-cell {
    width: 96px;
    text-align: center;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 0 14px;
  }
  .verdict-cell.pass {
    color: var(--pass);
    background: var(--pass-soft);
  }
  .verdict-cell.fail {
    color: var(--fail);
    background: var(--fail-soft);
  }
  .verdict-cell.pass::before, .verdict-cell.fail::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 6px;
    margin-bottom: 1px;
    vertical-align: middle;
    border-radius: 50%;
  }
  .verdict-cell.pass::before { background: var(--pass); }
  .verdict-cell.fail::before { background: var(--fail); }

  /* density variants */
  body.density-compact .cell-input,
  body.density-compact .table .idx-cell { height: 36px; }
  body.density-compact .cell-input { font-size: 13px; padding: 8px 12px; }
  body.density-compact .table thead th { padding: 9px 12px; }

  body.density-roomy .cell-input,
  body.density-roomy .table .idx-cell { height: 52px; }
  body.density-roomy .cell-input { font-size: 15px; padding: 14px 16px; }

  /* === TABLE FOOTER ACTIONS === */
  .table-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 0 0;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .table-actions .grp { display: flex; gap: 18px; align-items: center; }
  .link-btn {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--ink-2);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 1px solid var(--rule);
    transition: color .15s ease, border-color .15s ease;
  }
  .link-btn:hover { color: var(--ink); border-color: var(--ink); }

  /* === VERDICT / SUMMARY === */
  .verdict-banner {
    margin-top: 42px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    padding: 28px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 36px;
    position: relative;
    overflow: hidden;
  }
  .verdict-banner::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
  }
  .verdict-banner.v-pass::before { background: var(--pass); }
  .verdict-banner.v-fail::before { background: var(--fail); }
  .verdict-banner.v-review::before { background: var(--review); }

  .verdict-stamp {
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: 64px;
    line-height: 0.85;
    letter-spacing: -0.04em;
  }
  .verdict-banner.v-pass .verdict-stamp { color: var(--pass); }
  .verdict-banner.v-fail .verdict-stamp { color: var(--fail); }
  .verdict-banner.v-review .verdict-stamp { color: var(--review); }

  .verdict-stamp .small {
    display: block;
    font-family: var(--mono);
    font-style: normal;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 8px;
    font-weight: 400;
  }
  .verdict-meta {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .verdict-meta .vm-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .verdict-meta .vm-value {
    font-family: var(--display);
    font-weight: 500;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.012em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .verdict-meta .vm-value .frac {
    font-size: 14px;
    color: var(--ink-3);
    margin-left: 4px;
    font-family: var(--mono);
    font-weight: 400;
  }
  .verdict-sig {
    display: grid;
    gap: 4px;
    justify-items: end;
  }
  .verdict-sig .sig {
    font-family: var(--display);
    font-style: italic;
    font-size: 22px;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--ink-3);
    padding: 0 24px 2px;
  }
  .verdict-sig .sig-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-4);
  }

  @media (max-width: 900px) {
    .verdict-banner { grid-template-columns: 1fr; gap: 22px; padding: 22px; }
    .verdict-meta { grid-template-columns: repeat(2, 1fr); }
    .verdict-sig { justify-items: start; }
  }

  /* === EMPTY STATE === */
  .empty-state {
    border: 1px dashed var(--rule);
    background: var(--paper-2);
    padding: 80px 40px;
    text-align: center;
    color: var(--ink-3);
  }
  .empty-state .es-mark {
    font-family: var(--display);
    font-style: italic;
    font-size: 56px;
    color: var(--ink-3);
    margin-bottom: 10px;
    line-height: 1;
  }
  .empty-state .es-title {
    font-family: var(--display);
    font-weight: 500;
    font-size: 22px;
    color: var(--ink-2);
    letter-spacing: -0.012em;
    margin-bottom: 6px;
  }
  .empty-state .es-hint {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-4);
  }

  /* === COLOPHON === */
  .colophon {
    margin-top: 72px;
    padding-top: 22px;
    border-top: 1px solid var(--ink);
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .colophon::before {
    content: "";
    position: absolute; left: 0; right: 0; top: -5px;
    height: 1px; background: var(--ink);
  }
  .colophon .center { text-align: center; }
  .colophon .right  { text-align: right; }
  .colophon .accent {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 12px;
    text-transform: none;
    color: var(--ink-2);
    letter-spacing: -0.005em;
  }

  /* === THEMES via body class === */
  body.theme-graphite {
    --paper:      #F1F1EF;
    --paper-2:    #E8E8E5;
    --paper-3:    #DDDDD9;
    --ink:        #16161A;
    --ink-2:      #2F3035;
    --ink-3:      #65676E;
    --ink-4:      #9A9BA2;
    --rule:       #D1D1CE;
    --rule-soft:  #E1E1DE;
    --pass:       #1F5538;
    --pass-soft:  #D3E0D6;
    --fail:       #862317;
    --fail-soft:  #E8D2CD;
  }
  body.theme-ink {
    --paper:      #0E0E11;
    --paper-2:    #16161A;
    --paper-3:    #1E1E22;
    --ink:        #ECE6D2;
    --ink-2:      #C7C2B0;
    --ink-3:      #8A8675;
    --ink-4:      #5B584F;
    --rule:       #2A2A2E;
    --rule-soft:  #1F1F23;
    --pass:       #6FA67A;
    --pass-soft:  #1F2A22;
    --fail:       #D87767;
    --fail-soft:  #2A1D1A;
    --review:     #D6A14F;
    --review-soft:#2A2218;
    --accent:     #8FA9E0;
    --accent-soft:#1A1F2E;
  }
  body.theme-ink .seal { background: var(--paper-2); }
  body.theme-ink .cell-input:focus { background: var(--paper-2); }

  /* === REDUCED MOTION SAFE === */
  @media (prefers-reduced-motion: no-preference) {
    .verdict-stamp, .verdict-meta .vm-value {
      animation: stamp 360ms cubic-bezier(.2,.7,.2,1) both;
    }
    .dropdown { animation: drop 160ms ease both; }
  }
  @keyframes stamp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  /* scrollbar polish */
  .dropdown::-webkit-scrollbar { width: 10px; }
  .dropdown::-webkit-scrollbar-track { background: var(--paper-2); }
  .dropdown::-webkit-scrollbar-thumb { background: var(--rule); border: 2px solid var(--paper-2); }
</style>
</head>
